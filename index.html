<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Portal & User Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="theme-toggle-wrap">
    <button id="btnThemeToggle" class="btn-icon" aria-label="Toggle Dark/Light Mode">
      <span id="themeIcon">🌙</span>
    </button>
  </div>

  <main class="auth-container">
    <!-- Card Container -->
    <div class="auth-card" id="authCard">

      <!-- Login View -->
      <div class="auth-view active" id="viewLogin">
        <div class="card-header">
          <h2>เข้าสู่ระบบ</h2>
          <p>กรุณากรอกอีเมลและรหัสผ่านเพื่อเข้าใช้งานระบบ</p>
        </div>

        <form id="formLogin" novalidate>
          <div class="input-group">
            <label for="loginEmail">อีเมล / Email</label>
            <input type="email" id="loginEmail" placeholder="student@rmuti.ac.th" required>
            <span class="error-msg" id="errLoginEmail"></span>
          </div>

          <div class="input-group">
            <div class="label-row">
              <label for="loginPassword">รหัสผ่าน / Password</label>
              <a href="#" class="link-sm" id="linkForgot">ลืมรหัสผ่าน?</a>
            </div>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
            <span class="error-msg" id="errLoginPassword"></span>
          </div>

          <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="card-footer">
          <p>ยังไม่มีบัญชีใช้งาน? <a href="#" id="linkGoRegister">สมัครสมาชิก</a></p>
        </div>
      </div>

      <!-- Register View -->
      <div class="auth-view" id="viewRegister">
        <div class="card-header">
          <h2>สมัครสมาชิก</h2>
          <p>สร้างบัญชีผู้ใช้ใหม่เพื่อเข้าถึงระบบ</p>
        </div>

        <form id="formRegister" novalidate>
          <div class="input-group">
            <label for="regName">ชื่อ-นามสกุล / Full Name</label>
            <input type="text" id="regName" placeholder="Thaworn Saengsawang" required>
            <span class="error-msg" id="errRegName"></span>
          </div>

          <div class="input-group">
            <label for="regEmail">อีเมล / Email</label>
            <input type="email" id="regEmail" placeholder="student@rmuti.ac.th" required>
            <span class="error-msg" id="errRegEmail"></span>
          </div>

          <div class="input-group">
            <label for="regPassword">รหัสผ่าน / Password</label>
            <input type="password" id="regPassword" placeholder="อย่างน้อย 8 ตัวอักษร" required>
            <span class="error-msg" id="errRegPassword"></span>
          </div>

          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <div class="card-footer">
          <p>มีบัญชีอยู่แล้ว? <a href="#" id="linkGoLogin">เข้าสู่ระบบ</a></p>
        </div>
      </div>

      <!-- Dashboard View (After Simulated Login) -->
      <div class="auth-view" id="viewDashboard">
        <div class="card-header">
          <div class="user-badge">🟢 Connected</div>
          <h2 id="dashWelcome">ยินดีต้อนรับ!</h2>
          <p>คุณได้เข้าสู่ระบบเรียบร้อยแล้ว (Session Active)</p>
        </div>

        <div class="dashboard-stats">
          <div class="stat-card">
            <span class="stat-lbl">Role</span>
            <span class="stat-val">CompEng Student</span>
          </div>
          <div class="stat-card">
            <span class="stat-lbl">Status</span>
            <span class="stat-val">Active</span>
          </div>
        </div>

        <button id="btnLogout" class="btn btn-secondary">ออกจากระบบ (Logout)</button>
      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
